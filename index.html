<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <link rel="apple-touch-icon" href="/logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>કરુણા-મૈત્રી ગ્રુપ - જીવદયા સેવા</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#051A3B" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Karuna Maitri" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
      @keyframes pwaPulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.05); opacity: 0.85; }
      }
      @keyframes pwaBounce {
        0%, 80%, 100% { transform: scale(0); }
        40% { transform: scale(1); }
      }
    </style>
  </head>
  <body style="margin: 0; padding: 0; background-color: #051A3B;">
    {/* Custom PWA & Mobile App Launch Splash Screen */}
    <div id="pwa-splash" style="position: fixed; inset: 0; z-index: 99999; background: linear-gradient(180deg, #051A3B 0%, #0B2F64 100%); display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 48px 24px; font-family: 'Noto Sans Gujarati', sans-serif; box-sizing: border-box; transition: opacity 0.4s ease-out, visibility 0.4s ease-out;">
      <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; width: 100%;">
        <div style="position: relative; display: inline-block;">
          <img src="/logo.jpg" alt="Karuna Maitri Logo" style="width: 120px; height: 120px; border-radius: 9999px; border: 3px solid #C5A059; box-shadow: 0 10px 30px rgba(0,0,0,0.5); object-fit: cover; animation: pwaPulse 3s infinite ease-in-out;" />
        </div>
        <h1 style="color: #FFFFFF; font-size: 26px; font-weight: 900; margin: 12px 0 0 0; text-align: center; letter-spacing: 0.5px;">
          કરુણા-મૈત્રી ગ્રુપ
        </h1>
        <p style="color: #C5A059; font-size: 13px; font-weight: 800; margin: 0; letter-spacing: 1.5px; text-transform: uppercase;">
          સુરેન્દ્રનગર • અબોલ જીવદયા સેવા
        </p>
        <div style="margin-top: 20px; display: flex; gap: 8px;">
          <div style="width: 9px; height: 9px; background: #C5A059; border-radius: 50%; animation: pwaBounce 1.4s infinite ease-in-out both;"></div>
          <div style="width: 9px; height: 9px; background: #C5A059; border-radius: 50%; animation: pwaBounce 1.4s infinite ease-in-out both 0.2s;"></div>
          <div style="width: 9px; height: 9px; background: #C5A059; border-radius: 50%; animation: pwaBounce 1.4s infinite ease-in-out both 0.4s;"></div>
        </div>
      </div>
      <div style="text-align: center; padding-bottom: 8px;">
        <p style="color: rgba(255,255,255,0.45); font-size: 10px; font-weight: 700; margin: 0 0 4px 0; text-transform: uppercase; letter-spacing: 1px; font-family: sans-serif;">
          Karuna Maitri Platform 2026
        </p>
        <p style="color: #C5A059; font-size: 13px; font-weight: 800; margin: 0; font-family: monospace; letter-spacing: 0.5px;">
          Developed & Engineered by Harsh Gosaliya
        </p>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.getRegistrations().then((registrations) => {
          for (let registration of registrations) {
            registration.unregister();
          }
        });
        if ("caches" in window) {
          caches.keys().then((names) => {
            for (let name of names) {
              caches.delete(name);
            }
          });
        }
      }
    </script>
  </body>
</html>
